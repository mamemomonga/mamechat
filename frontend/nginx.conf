# cloudflared 経由の実クライアントIPを復元する（$remote_addr / X-Real-IP を実IPにする）。
# 到達経路はトンネルのみ（公開ポートは 127.0.0.1 バインド）である前提。プライベート網＝
# Dockブリッジ/ループバックだけを信頼し、そこから来た CF-Connecting-IP を採用する。
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# コンプライアンス用アクセスログ（JSON, 1行1レコード）。realip復元後の client_ip が実IP。
# リクエストボディやCookieは記録しない（PII最小化）。
log_format compliance escape=json '{'
    '"time":"$time_iso8601",'
    '"client_ip":"$remote_addr",'
    '"cf_connecting_ip":"$http_cf_connecting_ip",'
    '"xff":"$http_x_forwarded_for",'
    '"cf_ray":"$http_cf_ray",'
    '"country":"$http_cf_ipcountry",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"protocol":"$server_protocol",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"request_time":$request_time'
'}';

# チャンネルURLのOGPはDB情報が必要なため、SNS/チャットのプレビューbotだけを
# バックエンドへ流す。通常ブラウザはReactアプリのindex.htmlを返す。
map $http_user_agent $channel_ogp_crawler {
    default 0;
    ~*(facebookexternalhit|Twitterbot|Slackbot|Slack-ImgProxy|Discordbot|TelegramBot|Line|Hatena|Misskey|Mastodon|Bluesky|SkypeUriPreview|WhatsApp|LinkedInBot) 1;
}

server {
    listen 80;
    server_name _;

    # サーバーバージョンを隠す
    server_tokens off;

    # コンプライアンス用アクセスログ（/var/log/nginx はホストへバインドマウントし logrotate で保全）。
    access_log /var/log/nginx/access.log compliance;
    error_log /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    # セキュリティヘッダー（全レスポンスに付与）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # img-src の blob: は添付画像のサムネイルプレビュー(URL.createObjectURL)用。
    # media-src の data: は読み上げ音声を解錠する無音WAV(data:audio/wav)用。
    # frame-src は YouTube 埋め込みプレイヤー用。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src https://www.youtube-nocookie.com; form-action 'self'; img-src 'self' https: data: blob:; media-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # 管理用フロントエンド（メインとは別バンドル）
    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    location ~ "^/channels/[a-z0-9][a-z0-9-]{6,48}[a-z0-9]$" {
        if ($channel_ogp_crawler) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    error_page 418 = @channel_ogp;

    location @channel_ogp {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        # ヘルスチェックはコンプライアンスログの対象外（ノイズ抑制）。
        access_log off;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # 画像・動画(GIF/APNG/MP4)アップロード用。バックエンドの上限(UPLOAD_MEDIA_MAX_BYTES,
        # 既定20MB)より少し大きくし、超過時はバックエンドのJSONエラー(413)を返させる。
        client_max_body_size 24m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
